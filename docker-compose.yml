services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Bound to localhost only: host-side tooling (drizzle-kit, db:seed, psql)
      # needs this reachable, but it shouldn't be open to the internet.
      # POSTGRES_HOST_PORT must be set in .env (pick a free port per machine).
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - alletech_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    env_file:
      - .env
    environment:
      # Overrides the .env value (which points at the host-mapped port)
      # with the in-network hostname so the container can reach postgres.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      # APP_HOST_PORT must be set in .env (pick a free port per machine).
      - "${APP_HOST_PORT}:3000"
    env_file:
      - .env
    environment:
      # Overrides the .env value (which points at the host-mapped port)
      # with the in-network hostname so the container can reach postgres.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_TRUST_HOST: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  alletech_postgres_data:
